<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>حجر ورقة مقص — لعب محلي</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --green: #4ecca3;
      --red: #e74c3c;
      --gold: #f39c12;
      --blue: #3498db;
      --text: #eee;
      --text-secondary: #999;
    }

    body {
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
    }

    h1 { font-size: 1.9rem; text-align: center; }
    h2 { font-size: 1.4rem; }
    .subtitle { color: var(--gold); text-align: center; font-size: 1.1rem; margin-bottom: 24px; }

    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 0.9rem; }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1.1rem;
      color: var(--text);
      direction: rtl;
    }
    input:focus { outline: none; border-color: var(--blue); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s, filter 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--green); color: #1a1a2e; }
    .btn-gold { background: var(--gold); color: #1a1a2e; }
    .btn-secondary { background: var(--border); }
    .btn:disabled { opacity: 0.4; }

    .rounds-select {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .round-opt {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .round-opt.active {
      border-color: var(--gold);
      background: rgba(243,156,18,0.15);
      color: var(--gold);
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-bottom: 20px;
    }
    .score-side {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      border-radius: 14px;
      background: var(--bg);
      border: 2px solid var(--border);
    }
    .score-side.active-turn {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(243,156,18,0.25);
    }
    .score-side .name {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .score-side .score {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--gold);
    }
    .score-vs {
      display: flex;
      align-items: center;
      font-size: 1.3rem;
      color: var(--text-secondary);
    }
    .round-label {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    /* Choice buttons */
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }
    .choice-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 22px 12px;
      border: 3px solid var(--border);
      border-radius: 18px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 110px;
      transition: transform 0.1s;
    }
    .choice-btn:active { transform: scale(0.94); }
    .choice-btn .emoji { font-size: 3.2rem; line-height: 1; }
    .choice-btn:last-child {
      grid-column: 1 / -1;
      max-width: 55%;
      justify-self: center;
      width: 100%;
    }

    .turn-title { text-align: center; margin-bottom: 4px; }
    .turn-hint {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    /* Pass screen */
    .pass-screen { text-align: center; padding: 20px 0; }
    .pass-icon { font-size: 5rem; margin-bottom: 16px; animation: sway 1.2s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }
    .pass-name { font-size: 2rem; font-weight: 800; color: var(--gold); margin: 8px 0 24px; }

    /* Reveal */
    .reveal { text-align: center; }
    .reveal-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 24px 0;
    }
    .reveal-side { flex: 1; }
    .reveal-side .r-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reveal-side .r-choice { font-size: 4.5rem; line-height: 1; animation: pop 0.5s ease-out; }
    .reveal-side.winner .r-name { color: var(--green); }
    .reveal-side.loser { opacity: 0.4; }
    .reveal-vs { font-size: 2rem; color: var(--gold); }
    @keyframes pop {
      0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.2); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .reveal-result {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 16px 0;
    }
    .reveal-result.win { color: var(--green); }
    .reveal-result.draw { color: var(--gold); }

    /* Winner */
    .final { text-align: center; }
    .final .trophy { font-size: 6rem; margin-bottom: 12px; }
    .final .champ { font-size: 2.4rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
    .final .final-score { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 24px; }

    .mt { margin-top: 14px; }
    .hidden { display: none !important; }

    canvas#confetti {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Setup -->
    <div id="screen-setup" class="card">
      <h1>حجر ورقة مقص</h1>
      <div class="subtitle">لعب على جوال واحد — بدون نت</div>

      <div class="field">
        <label>اللاعب الأول</label>
        <input type="text" id="name1" maxlength="14" placeholder="اسمك">
      </div>
      <div class="field">
        <label>اللاعب الثاني</label>
        <input type="text" id="name2" maxlength="14" placeholder="اسم خويك">
      </div>

      <div class="field">
        <label>عدد النقاط للفوز</label>
        <div class="rounds-select" id="rounds-select">
          <button class="round-opt" data-target="2">2</button>
          <button class="round-opt active" data-target="3">3</button>
          <button class="round-opt" data-target="5">5</button>
        </div>
      </div>

      <button class="btn btn-primary mt" id="btn-start">ابدأ اللعب</button>
    </div>

    <!-- Player turn (choose) -->
    <div id="screen-turn" class="card hidden">
      <div class="scoreboard" id="turn-scoreboard"></div>
      <div class="round-label">الجولة <span id="turn-round">1</span></div>
      <h2 class="turn-title" id="turn-name">اللاعب</h2>
      <div class="turn-hint">اختر بسرية 🤫 لا تخلي خصمك يشوف</div>
      <div class="choice-grid">
        <button class="choice-btn" data-choice="rock"><span class="emoji">✊</span><span>حجر</span></button>
        <button class="choice-btn" data-choice="paper"><span class="emoji">✋</span><span>ورقة</span></button>
        <button class="choice-btn" data-choice="scissors"><span class="emoji">✌️</span><span>مقص</span></button>
      </div>
    </div>

    <!-- Pass phone -->
    <div id="screen-pass" class="card hidden">
      <div class="pass-screen">
        <div class="pass-icon">🤝</div>
        <div>مرّر الجوال إلى</div>
        <div class="pass-name" id="pass-name">اللاعب الثاني</div>
        <button class="btn btn-gold" id="btn-pass-ready">أنا جاهز</button>
      </div>
    </div>

    <!-- Reveal -->
    <div id="screen-reveal" class="card hidden">
      <div class="reveal">
        <div class="round-label">نتيجة الجولة <span id="reveal-round">1</span></div>
        <div class="reveal-row">
          <div class="reveal-side" id="reveal-p1">
            <div class="r-name" id="reveal-name1">-</div>
            <div class="r-choice" id="reveal-choice1">✊</div>
          </div>
          <div class="reveal-vs">⚔️</div>
          <div class="reveal-side" id="reveal-p2">
            <div class="r-name" id="reveal-name2">-</div>
            <div class="r-choice" id="reveal-choice2">✋</div>
          </div>
        </div>
        <div class="reveal-result" id="reveal-result">فاز!</div>
        <div class="scoreboard" id="reveal-scoreboard" style="margin-top:20px;"></div>
        <button class="btn btn-primary mt" id="btn-next">الجولة التالية</button>
      </div>
    </div>

    <!-- Final winner -->
    <div id="screen-final" class="card hidden">
      <div class="final">
        <div class="trophy">🏆</div>
        <div class="champ" id="champ-name">البطل</div>
        <div class="final-score" id="final-score">-</div>
        <button class="btn btn-gold" id="btn-rematch">لعبة جديدة (نفس اللاعبين)</button>
        <button class="btn btn-secondary mt" id="btn-home">تغيير اللاعبين</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="hidden"></canvas>

  <script>
    const emoji = { rock: '✊', paper: '✋', scissors: '✌️' };
    const cname = { rock: 'حجر', paper: 'ورقة', scissors: 'مقص' };

    const state = {
      p1: 'اللاعب 1',
      p2: 'اللاعب 2',
      target: 3,
      score1: 0,
      score2: 0,
      round: 1,
      choice1: null,
      choice2: null,
      turn: 1
    };

    function show(id) {
      ['setup','turn','pass','reveal','final'].forEach(s =>
        document.getElementById('screen-' + s).classList.add('hidden'));
      document.getElementById('screen-' + id).classList.remove('hidden');
    }

    // استرجاع الأسماء المحفوظة للانضمام السريع
    try {
      const n1 = localStorage.getItem('rps-local-name1');
      const n2 = localStorage.getItem('rps-local-name2');
      if (n1) document.getElementById('name1').value = n1;
      if (n2) document.getElementById('name2').value = n2;
    } catch (e) { /* المتصفح يمنع التخزين */ }

    // Rounds select
    document.querySelectorAll('.round-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.round-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.target = parseInt(btn.dataset.target);
      });
    });

    // Start
    document.getElementById('btn-start').addEventListener('click', () => {
      const n1 = document.getElementById('name1').value.trim();
      const n2 = document.getElementById('name2').value.trim();
      state.p1 = n1 || 'اللاعب 1';
      state.p2 = n2 || 'اللاعب 2';
      // حفظ الأسماء للمرة الجاية
      try {
        if (n1) localStorage.setItem('rps-local-name1', n1);
        if (n2) localStorage.setItem('rps-local-name2', n2);
      } catch (e) { /* المتصفح يمنع التخزين */ }
      state.score1 = 0;
      state.score2 = 0;
      state.round = 1;
      startTurn(1);
    });

    function scoreboardHtml(activeTurn) {
      const a1 = activeTurn === 1 ? 'active-turn' : '';
      const a2 = activeTurn === 2 ? 'active-turn' : '';
      return `
        <div class="score-side ${a1}">
          <div class="name">${esc(state.p1)}</div>
          <div class="score">${state.score1}</div>
        </div>
        <div class="score-vs">⚔️</div>
        <div class="score-side ${a2}">
          <div class="name">${esc(state.p2)}</div>
          <div class="score">${state.score2}</div>
        </div>`;
    }

    function startTurn(turn) {
      state.turn = turn;
      show('turn');
      document.getElementById('turn-scoreboard').innerHTML = scoreboardHtml(turn);
      document.getElementById('turn-round').textContent = state.round;
      document.getElementById('turn-name').textContent =
        (turn === 1 ? state.p1 : state.p2) + ' — دورك';
    }

    document.querySelectorAll('#screen-turn .choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = btn.dataset.choice;
        if (state.turn === 1) {
          state.choice1 = choice;
          // pass to player 2
          document.getElementById('pass-name').textContent = state.p2;
          show('pass');
        } else {
          state.choice2 = choice;
          reveal();
        }
      });
    });

    document.getElementById('btn-pass-ready').addEventListener('click', () => {
      startTurn(2);
    });

    function reveal() {
      show('reveal');
      const c1 = state.choice1, c2 = state.choice2;
      document.getElementById('reveal-round').textContent = state.round;
      document.getElementById('reveal-name1').textContent = state.p1;
      document.getElementById('reveal-name2').textContent = state.p2;
      document.getElementById('reveal-choice1').textContent = emoji[c1];
      document.getElementById('reveal-choice2').textContent = emoji[c2];

      const p1El = document.getElementById('reveal-p1');
      const p2El = document.getElementById('reveal-p2');
      const resEl = document.getElementById('reveal-result');
      p1El.className = 'reveal-side';
      p2El.className = 'reveal-side';

      const outcome = judge(c1, c2);
      if (outcome === 'draw') {
        resEl.textContent = '🔄 تعادل — أعيدوا الجولة';
        resEl.className = 'reveal-result draw';
      } else if (outcome === 'p1') {
        state.score1++;
        p1El.classList.add('winner');
        p2El.classList.add('loser');
        resEl.textContent = '🎉 فاز ' + state.p1;
        resEl.className = 'reveal-result win';
      } else {
        state.score2++;
        p2El.classList.add('winner');
        p1El.classList.add('loser');
        resEl.textContent = '🎉 فاز ' + state.p2;
        resEl.className = 'reveal-result win';
      }

      document.getElementById('reveal-scoreboard').innerHTML = scoreboardHtml(0);

      // Check win
      const btnNext = document.getElementById('btn-next');
      if (state.score1 >= state.target || state.score2 >= state.target) {
        btnNext.textContent = 'النتيجة النهائية 🏆';
      } else {
        btnNext.textContent = 'الجولة التالية';
      }
    }

    function judge(a, b) {
      if (a === b) return 'draw';
      if ((a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock'))
        return 'p1';
      return 'p2';
    }

    document.getElementById('btn-next').addEventListener('click', () => {
      if (state.score1 >= state.target || state.score2 >= state.target) {
        finish();
      } else {
        state.round++;
        state.choice1 = null;
        state.choice2 = null;
        startTurn(1);
      }
    });

    function finish() {
      show('final');
      const winner = state.score1 > state.score2 ? state.p1 : state.p2;
      document.getElementById('champ-name').textContent = winner;
      document.getElementById('final-score').textContent =
        `${esc(state.p1)} ${state.score1} — ${state.score2} ${esc(state.p2)}`;
      confetti();
    }

    document.getElementById('btn-rematch').addEventListener('click', () => {
      state.score1 = 0; state.score2 = 0; state.round = 1;
      state.choice1 = null; state.choice2 = null;
      startTurn(1);
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      show('setup');
    });

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function confetti() {
      const canvas = document.getElementById('confetti');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const W = canvas.width, H = canvas.height;
      const colors = ['#f39c12','#4ecca3','#e74c3c','#3498db','#fff'];
      const parts = [];
      for (let i = 0; i < 140; i++) {
        parts.push({
          x: Math.random()*W, y: Math.random()*H - H,
          w: Math.random()*10+4, h: Math.random()*7+3,
          c: colors[Math.floor(Math.random()*colors.length)],
          vx: (Math.random()-0.5)*4, vy: Math.random()*3+2,
          rot: Math.random()*360, rv: (Math.random()-0.5)*10
        });
      }
      let f = 0;
      (function anim() {
        ctx.clearRect(0,0,W,H);
        parts.forEach(p => {
          p.x+=p.vx; p.y+=p.vy; p.rot+=p.rv;
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
          ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
        });
        if (++f < 220) requestAnimationFrame(anim);
        else canvas.classList.add('hidden');
      })();
    }
  </script>
</body>
</html>
